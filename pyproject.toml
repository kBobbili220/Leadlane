[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "service-business-app"
version = "0.1.0"
description = "FastAPI backend for a service business application"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi[standard]>=0.115,<1.0",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.6,<3",
    "SQLAlchemy>=2.0,<2.1",
    "psycopg[binary]>=3.2,<4",
    "pwdlib[argon2]>=0.3,<1",
]

[project.optional-dependencies]
test = ["pglast>=7,<8"]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.fastapi]
entrypoint = "backend.app.main:app"
